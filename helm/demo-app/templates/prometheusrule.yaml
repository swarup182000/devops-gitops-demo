apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: demo-app-alerts
  labels:
    app: demo-app
spec:
  groups:
    - name: demo-app
      rules:
        - alert: DemoAppDown
          expr: sum(up{job="demo-app"}) < 1 or absent(up{job="demo-app"})
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "demo-app is down"
